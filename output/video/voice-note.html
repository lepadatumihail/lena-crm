<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LeadWing Film 03 · Voice note</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
  // ?format=landscape (16:9, default) · portrait (4:5). ?lang=es is the Spanish cut on the same clock.
  { const f = new URLSearchParams(location.search).get("format"), el = document.documentElement;
    el.dataset.format = f === "portrait" ? "portrait" : "landscape"; el.classList.toggle("vert", el.dataset.format !== "landscape"); }
</script>
<!--
  LeadWing film 03, "Voice note". Straight after a viewing an agent holds the + and talks; the
  note splits phrase by phrase into the review cards the app really shows (one per person:
  Lars's viewing, wishes, stage and appointment; a new client, Anna), the agent saves, and each
  part lands where it lives: the board, the calendar. Same engine as films 01 and 02: one clock,
  render(t) sets every element from the time alone, `record.mjs --film voice-note` steps it frame
  by frame into ffmpeg. Open this file to watch it live (space pauses, arrows step, drag the bar).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Sora:wght@400;500&display=block" rel="stylesheet">
<style>
:root {
  /* The app's dark-mode tokens (src/app/globals.css, .dark). */
  --stage: oklch(0.145 0.006 56);
  --bg: oklch(0.19 0.005 56);
  --card: oklch(0.225 0.005 56);
  --card2: oklch(0.25 0.006 56);
  --fg: oklch(0.96 0.006 84);
  --fg80: oklch(0.96 0.006 84 / 0.8);
  --fg45: oklch(0.96 0.006 84 / 0.46);
  --muted: oklch(0.68 0.008 70);
  --line: oklch(1 0 0 / 0.09);
  --input: oklch(1 0 0 / 0.14);
  --mutedbg: oklch(0.27 0.006 56);
  --primary: oklch(0.56 0.18 277);
  --primary-fg: oklch(0.985 0 0);
  --indigo: oklch(0.7 0.15 277); --indigo-soft: oklch(0.6 0.19 277 / 20%); --indigo-ink: oklch(0.84 0.08 280);
  --teal: oklch(0.74 0.11 200); --teal-soft: oklch(0.7 0.12 200 / 16%); --teal-ink: oklch(0.86 0.07 200);
  --red: oklch(0.637 0.237 25.331);
  /* The light end card: the landing's own tokens and the brand indigo. */
  --brand: #4b50d5; --l-fg: oklch(0.205 0 0); --l-muted: oklch(0.52 0 0);
  --display: "Sora", system-ui, sans-serif; --sans: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #050505; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--stage); color: var(--fg); font-family: var(--sans); transform-origin: 0 0; -webkit-font-smoothing: antialiased; }
#canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.vert #stage, .vert #canvas { width: 1080px; height: 1350px; }
.full { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.w { display: inline-block; }
.mut { color: var(--muted); }

/* Background: near-black, a faint grid, soft indigo and teal lights. */
#bg { overflow: hidden; background: var(--stage); }
#grid { position: absolute; inset: -120px; background-image: linear-gradient(oklch(1 0 0 / 3%) 1px, transparent 1px), linear-gradient(90deg, oklch(1 0 0 / 3%) 1px, transparent 1px); background-size: 80px 80px; -webkit-mask-image: radial-gradient(ellipse 58% 52% at 50% 50%, #000 5%, transparent 78%); mask-image: radial-gradient(ellipse 58% 52% at 50% 50%, #000 5%, transparent 78%); }
.glow { position: absolute; left: 0; top: 0; width: 1500px; height: 1150px; margin: -575px 0 0 -750px; border-radius: 50%; opacity: 0; }
#gInd { background: radial-gradient(closest-side, oklch(0.56 0.2 277 / .42), oklch(0.56 0.2 277 / .14) 45%, oklch(0.56 0.2 277 / .03) 75%, transparent); }
#gTeal { background: radial-gradient(closest-side, oklch(0.7 0.13 200 / .36), oklch(0.7 0.13 200 / .12) 45%, oklch(0.7 0.13 200 / .03) 75%, transparent); }
#gKey { background: radial-gradient(closest-side, oklch(0.97 0.02 80 / .1), oklch(0.97 0.02 80 / .03) 50%, transparent); }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse 78% 72% at 50% 50%, transparent 48%, rgba(0,0,0,.55)); }
#grain { pointer-events: none; opacity: .05; z-index: 60; background-size: 256px 256px; }

/* The small LeadWing mark in the corner while the story plays. */
#mark { position: absolute; display: flex; align-items: center; gap: 10px; color: var(--fg); opacity: 0; z-index: 30; }
#mark .mw { height: 27px; width: auto; fill: currentColor; }
#mark .mt { height: 22px; width: auto; fill: currentColor; }

#cam { position: absolute; inset: 0; transform-origin: 50% 50%; }

/* Headlines: Sora, regular, revealed line by line from behind a mask. */
.hd { position: absolute; margin: 0; font: 400 84px/1.08 var(--display); letter-spacing: -.03em; color: var(--fg); visibility: hidden; }
.vert .hd { font-size: 72px; }
.hd em { font-style: normal; color: var(--fg45); }
.hd .ln { display: block; overflow: hidden; padding: .06em .1em .16em 0; margin: -.06em 0 -.16em; }
.hd .li { display: block; white-space: nowrap; }
.hd .tick { display: inline-grid; place-items: center; width: .62em; height: .62em; margin-right: .26em; vertical-align: .02em; border-radius: 50%; font-size: 1em; }
.hd .tick svg { width: .42em; height: .42em; stroke-width: 3; }

/* What the agent says: the words appear as they're spoken. */
#quote { position: absolute; visibility: hidden; }
.qlab { display: flex; align-items: center; gap: 16px; height: 52px; margin-bottom: 22px; font: 500 24px/1 var(--sans); color: var(--muted); }
.qmic { position: relative; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--indigo-soft); color: var(--indigo-ink); font-size: 26px; flex: none; }
.qmic .dot { position: absolute; right: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 3px var(--stage); }
.qt { position: relative; height: 24px; min-width: 210px; }
.qt span { position: absolute; left: 0; top: 0; white-space: nowrap; }
#wave { display: flex; align-items: center; gap: 5px; height: 52px; margin-left: 4px; }
#wave i { display: block; width: 6px; height: 6px; border-radius: 3px; background: var(--indigo); }
.qtext { margin: 0; font: 400 46px/1.36 var(--sans); letter-spacing: -.01em; color: var(--fg); }
.vert .qtext { font-size: 42px; }
.ph { border-radius: .22em; padding: .02em .1em; margin: 0 -.1em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

/* The recorder: the phone's tab bar, its + held down, and the bar that says it's recording. */
#world { position: absolute; inset: 0; perspective: 2400px; }
#rec { position: absolute; left: 0; top: 0; width: 700px; height: 340px; transform-origin: 50% 70%; }
.vert #rec { width: 820px; }
#tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 128px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 34px; box-shadow: 0 50px 100px -40px rgba(0,0,0,.9), inset 0 1px 0 oklch(1 0 0 / 5%); }
.tb { display: flex; flex-direction: column; align-items: center; gap: 9px; font: 400 18px/1 var(--sans); color: var(--muted); }
.tb svg { font-size: 34px; stroke-width: 1.75; }
.tb.on { color: var(--fg); font-weight: 500; }
.tb.on svg { stroke-width: 2.1; }
#plus { position: relative; display: grid; place-items: center; width: 104px; height: 104px; border-radius: 50%; background: var(--primary); color: var(--primary-fg); font-size: 48px; box-shadow: 0 18px 40px -12px oklch(0.56 0.2 277 / .7); }
#plus svg { stroke-width: 2.2; }
#rings { position: absolute; left: 0; top: 0; width: 0; height: 0; }
#rings i { position: absolute; left: -52px; top: -52px; width: 104px; height: 104px; border-radius: 50%; border: 2px solid oklch(0.8 0.1 277 / .9); opacity: 0; }
#pill { position: absolute; left: 50%; top: 0; height: 74px; display: flex; align-items: center; gap: 14px; padding: 0 30px; border-radius: 999px; background: var(--fg); color: var(--bg); font: 500 28px/1 var(--sans); white-space: nowrap; box-shadow: 0 24px 60px -18px rgba(0,0,0,.8); overflow: hidden; }
#pill .pd { width: 18px; height: 18px; border-radius: 50%; background: var(--red); flex: none; }
#pill .ps { display: none; font-size: 28px; color: var(--bg); }
#clock { font-variant-numeric: tabular-nums; }
.plab { position: relative; height: 30px; }
.plab span { position: absolute; left: 0; top: 0; white-space: nowrap; opacity: 0; }
.plab span:first-child { color: oklch(0.19 0.005 56 / .75); }

/* The review: one card per person, as the voice-note sheet shows them. */
#review { position: absolute; left: 0; top: 0; transform-origin: 50% 40%; visibility: hidden; }
.rsum { margin: 0 0 18px; font: 400 24px/1.35 var(--sans); color: var(--muted); }
.card { position: relative; margin-bottom: 16px; padding: 22px 26px 24px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 50px 100px -45px rgba(0,0,0,.95), inset 0 1px 0 oklch(1 0 0 / 5%); }
.chd { display: flex; align-items: center; gap: 14px; height: 40px; }
.chd b { font: 500 29px/1 var(--sans); white-space: nowrap; }
.chd .st { font: 400 24px/1 var(--sans); color: var(--muted); white-space: nowrap; }
.chd .lnk { margin-left: auto; font: 500 20px/1 var(--sans); color: var(--indigo-ink); }
.cb { position: relative; width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 8px; border: 1.5px solid oklch(0.96 0.006 84 / .3); }
.cb .f { position: absolute; inset: -1.5px; border-radius: 8px; background: var(--primary); transform: scale(0); }
.cb svg { position: relative; font-size: 18px; color: var(--primary-fg); stroke-width: 3.2; opacity: 0; }
.cb.on .f { transform: scale(1); }
.cb.on svg { opacity: 1; }
.rows { margin-top: 6px; padding-left: 42px; }
.row { position: relative; display: grid; grid-template-columns: 28px 206px minmax(0, 1fr); align-items: center; column-gap: 14px; min-height: 58px; }
.vert .row { grid-template-columns: 28px 212px minmax(0, 1fr); min-height: 53px; }
/* 4:5 plays on phones: the interface type runs a size up. */
.vert .row .rl, .vert .row .rv { font-size: 27px; }
.vert .row .rv small { font-size: 21px; }
.vert .chd b { font-size: 31px; } .vert .chd .st { font-size: 25px; } .vert .chd .lnk { font-size: 22px; }
.vert .chip2 { height: 40px; font-size: 22px; }
.vert .inp { font-size: 26px; } .vert .inp small { font-size: 23px; }
.vert .btn { height: 60px; font-size: 26px; }
.vert .kc b { font-size: 26px; } .vert .kc .fig { font-size: 26px; } .vert .kc .chips .tag { font-size: 17px; }
.vert .colh { font-size: 25px; }
.vert .ev { font-size: 22px; } .vert .ev small { font-size: 18px; } .vert .days { font-size: 23px; } .vert .calh { font-size: 27px; }
.vert .svt { font-size: 38px; } .vert .svr b { font-size: 31px; } .vert .svr small { font-size: 25px; } .vert .svr .op { font-size: 24px; }
.vert .rsum { display: none; }
.vert .card { padding: 18px 24px 16px; margin-bottom: 14px; }
.vert .nms { margin-top: 10px; }
.vert .inp { height: 50px; }
.row .rl { font: 500 25px/1.2 var(--sans); white-space: nowrap; }
.row .rv { position: relative; font: 400 25px/1.25 var(--sans); color: var(--fg); white-space: nowrap; }
.row .rv small { margin-left: 10px; font-size: 20px; color: var(--muted); }
.row .rv i { font-style: normal; color: var(--muted); }
.row .sk { position: absolute; left: 0; top: 50%; height: 14px; margin-top: -7px; border-radius: 7px; background: oklch(1 0 0 / 7%); }
.row .fl { position: absolute; left: -12px; right: -14px; top: 4px; bottom: 4px; border-radius: 12px; opacity: 0; }
.tag { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 15px; border-radius: 999px; font: 500 20px/1 var(--sans); white-space: nowrap; vertical-align: middle; }
.tag.teal { background: var(--teal-soft); color: var(--teal-ink); }
.tag.indigo { background: var(--indigo-soft); color: var(--indigo-ink); }
.tag.grey { background: var(--mutedbg); color: var(--fg80); }
.tag svg { font-size: 18px; }
.chip2 { display: inline-flex; align-items: center; height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--input); font: 500 20px/1 var(--sans); color: var(--fg80); white-space: nowrap; }
.chip2.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.nms { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0 4px 42px; }
.inp { position: relative; height: 54px; display: flex; align-items: center; padding: 0 16px; border: 1px solid var(--input); border-radius: 13px; background: oklch(1 0 0 / 2.5%); font: 400 23px/1 var(--sans); overflow: hidden; }
.inp small { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 21px; color: var(--muted); }
.inp span { position: relative; }
.rf { display: flex; justify-content: flex-end; gap: 12px; margin-top: 4px; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 58px; padding: 0 28px; border-radius: 15px; font: 500 23px/1 var(--sans); white-space: nowrap; }
.btn.ghost { color: var(--fg80); }
.btn.pri { background: var(--primary); color: var(--primary-fg); min-width: 150px; }
.btn.pri .bl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; }

/* Saved. */
#saved { position: absolute; left: 0; top: 0; visibility: hidden; }
.svt { display: flex; align-items: center; gap: 14px; margin: 0 0 22px; font: 500 34px/1.2 var(--sans); }
.svt i { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--indigo-soft); color: var(--indigo-ink); font-size: 24px; }
.svt i svg { stroke-width: 2.6; }
.svr { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; padding: 22px 24px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 40px 80px -40px rgba(0,0,0,.9), inset 0 1px 0 oklch(1 0 0 / 5%); }
.svr .tx { flex: 1; min-width: 0; }
.svr b { display: block; font: 500 28px/1.2 var(--sans); white-space: nowrap; }
.svr b span { font-weight: 400; color: var(--muted); }
.svr small { display: block; margin-top: 8px; font: 400 23px/1.2 var(--sans); color: var(--muted); white-space: nowrap; }
.svr .op { font: 500 21px/1 var(--sans); color: var(--fg80); }

/* Avatars: initials on the indigo-to-teal disc the app gives every client. */
.av { display: grid; place-items: center; width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(140deg, var(--indigo-soft), var(--teal-soft)); box-shadow: inset 0 0 0 1px oklch(0.96 0.006 84 / .1); color: var(--indigo-ink); font: 500 18px/1 var(--sans); flex: none; }

/* The board. */
#board { position: absolute; left: 0; top: 0; visibility: hidden; transform-origin: 50% 50%; }
.colh { position: absolute; top: 0; display: flex; align-items: center; gap: 11px; height: 44px; padding: 0 4px; font: 500 23px/1 var(--sans); white-space: nowrap; }
.colh .dot { width: 12px; height: 12px; border-radius: 50%; }
.cnt { position: relative; display: inline-grid; place-items: center; min-width: 32px; height: 28px; padding: 0 9px; border-radius: 999px; background: var(--mutedbg); overflow: hidden; font: 500 17px/1 var(--sans); font-variant-numeric: tabular-nums; color: var(--muted); }
.cnt span { grid-area: 1 / 1; }
.colbg { position: absolute; border-radius: 22px; background: oklch(1 0 0 / 2.2%); }
.kc { position: absolute; left: 0; top: 0; padding: 16px 17px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.9), inset 0 1px 0 oklch(1 0 0 / 5%); }
.kc .kt { display: flex; align-items: flex-start; gap: 13px; }
.kc .av { width: 46px; height: 46px; font-size: 17px; }
.kc b { display: block; margin-top: 1px; font: 500 24px/1.2 var(--sans); white-space: nowrap; }
.kc .fig { position: relative; height: 32px; margin-top: 3px; font: 400 24px/32px var(--display); letter-spacing: -.01em; white-space: nowrap; }
.kc .fig > span { position: absolute; left: 0; top: 0; }
.kc .cur { color: var(--muted); }
.kc .chips { display: flex; gap: 7px; margin-top: 13px; padding-left: 59px; height: 30px; }
.kc .chips .tag { height: 30px; padding: 0 12px; font-size: 16px; gap: 6px; }
.kc .chips .tag svg { font-size: 15px; }
.kc .ring { position: absolute; inset: -1px; border-radius: 18px; box-shadow: 0 0 0 2px var(--teal); opacity: 0; }

/* The week. */
#cal { position: absolute; left: 0; top: 0; padding: 22px 24px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 50px 100px -45px rgba(0,0,0,.95), inset 0 1px 0 oklch(1 0 0 / 5%); visibility: hidden; transform-origin: 50% 30%; }
.calh { display: flex; align-items: baseline; justify-content: space-between; font: 500 25px/1 var(--sans); }
.calh span { font: 400 20px/1 var(--sans); color: var(--muted); }
.days { display: grid; grid-template-columns: 84px repeat(3, 1fr); margin-top: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--line); font: 500 21px/1 var(--sans); color: var(--muted); white-space: nowrap; }
.days span { padding-left: 12px; }
.days .td { color: var(--fg); }
.cgrid { position: relative; }
.cgrid .lines { position: absolute; left: 84px; right: 0; top: 0; bottom: 0; }
.hr { position: absolute; left: 0; font: 400 17px/1 var(--mono); color: var(--muted); }
.ev { position: absolute; padding: 10px 14px; border-radius: 10px; border-left: 3px solid; font: 500 20px/1.2 var(--sans); white-space: nowrap; overflow: hidden; }
.ev small { display: block; margin-top: 5px; font: 400 17px/1.2 var(--sans); opacity: .8; font-variant-numeric: tabular-nums; }
.ev.grey { background: var(--mutedbg); color: var(--fg80); border-color: oklch(0.96 0.006 84 / .4); }
.ev.teal { background: var(--teal-soft); color: var(--teal-ink); border-color: var(--teal); }
#evNew { background: oklch(0.32 0.008 56); color: var(--fg); }

/* The touch that holds the + and taps Save. */
#touch { position: absolute; left: 0; top: 0; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%; background: radial-gradient(closest-side, oklch(1 0 0 / .34), oklch(1 0 0 / .14) 70%, oklch(1 0 0 / .1)); box-shadow: 0 0 0 2.5px oklch(1 0 0 / .7), 0 14px 34px rgba(0,0,0,.4); z-index: 40; opacity: 0; }
#flights { position: absolute; inset: 0; z-index: 35; pointer-events: none; }
.fly { position: absolute; left: 0; top: 0; padding: .02em .16em; border-radius: .22em; font: 400 46px/1.36 var(--sans); letter-spacing: -.01em; color: var(--fg); white-space: nowrap; transform-origin: 0 50%; opacity: 0; box-shadow: 0 18px 40px -16px rgba(0,0,0,.7); }
.vert .fly { font-size: 42px; }

/* The light end card, the site's own look. */
#end { background: #fff; color: var(--l-fg); visibility: hidden; z-index: 50; }
#endIn { position: absolute; inset: 0; transform-origin: 50% 45%; }
#logo { position: absolute; left: 50%; top: 0; display: flex; align-items: center; gap: 22px; }
#logo .lw { height: 112px; width: auto; fill: var(--brand); }
#logo .lwm { height: 88px; width: auto; fill: var(--l-fg); }
.vert #logo .lw { height: 96px; } .vert #logo .lwm { height: 75px; }
#endLine, #tagl { position: absolute; left: 0; right: 0; margin: 0; text-align: center; }
#endLine { font: 400 68px/1.12 var(--display); letter-spacing: -.03em; color: var(--l-fg); }
#endLine em { font-style: normal; color: var(--l-muted); }
.vert #endLine { font-size: 64px; }
#tagl { font: 400 30px/1.3 var(--sans); color: var(--l-muted); }
#cta { position: absolute; left: 50%; top: 0; display: inline-flex; align-items: center; gap: 14px; height: 80px; padding: 0 40px; border-radius: 999px; background: var(--brand); color: #fff; font: 500 30px/1 var(--sans); white-space: nowrap; }
#white { background: #fff; opacity: 0; z-index: 45; pointer-events: none; }

/* Live preview controls (hidden while recording). */
#ctrl { position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: rgba(0,0,0,.6); color: #fff; font: 500 13px ui-monospace, monospace; transition: opacity .3s; }
#ctrl input { flex: 1; }
#ctrl button { padding: 4px 10px; border: 1px solid rgba(255,255,255,.3); border-radius: 6px; background: none; color: #fff; font: inherit; cursor: pointer; }
.rec #ctrl { display: none; }
.idle #ctrl { opacity: 0; }
</style>
</head>
<body>
<div id="stage">
<div id="canvas">
  <div id="bg" class="full">
    <div id="grid"></div>
    <div class="glow" id="gKey"></div>
    <div class="glow" id="gInd"></div>
    <div class="glow" id="gTeal"></div>
    <div id="vig"></div>
  </div>

  <div id="mark"><svg class="mw" viewBox="0 0 240 190" data-brand="wing"></svg><svg class="mt" viewBox="0 0 757 172" data-brand="word"></svg></div>

  <div id="cam">

function placeGlow(el, x, y, s = 1) { el.style.transform = `translate(${f2(x)}px,${f2(y)}px) scale(${s.toFixed(4)})`; }
function level(t) {

  const recOn = t < T.rel;
  show(dot, recOn); show(clock, recOn); spin.style.display = recOn ? "none" : "flex";
  if (!recOn) spin.style.transform = `rotate(${((t - T.rel) * 520) % 360}deg)`;
  op(dot, 0.5 + 0.5 * Math.round((Math.sin((t - T.rec) * 6.2) + 1) / 2));
  const sec = Math.min(24, Math.floor(Math.max(0, t - T.rec) * CLOCK_RATE));
  const txt = `0:${String(sec).padStart(2, "0")}`; if (clock.textContent !== txt) clock.textContent = txt;
  const ls = [$("#pl1"), $("#pl2"), $("#pl3")], lo = [1 - sw1, sw1 * (1 - sw2), sw2];
  ls.forEach((s, i) => { op(s, lo[i]); s.style.transform = `translateY(${f2((1 - lo[i]) * (i < lab ? -16 : 16))}px)`; });
  $("#plab").style.width = (M.pillW ? lerp(lerp(M.pillW[0], M.pillW[1], sw1), M.pillW[2], sw2) : 0) + "px";
  // Sound: rings off the + while the voice comes in.
  const lv = level(t);
  rings.forEach((r, k) => {
    const ph = ((t - T.rec) * 0.95 + k / 3) % 1, live = P(t, T.rec, T.rec + 0.4) * (1 - P(t, T.rel - 0.1, T.rel + 0.2));
    r.style.transform = `scale(${(1.05 + ph * (1.3 + 0.6 * lv)).toFixed(4)})`;
    op(r, live * (1 - ph) * (0.32 + 0.68 * lv));
  });
  const pb = box(plus); M.plusC = [pb.x + pb.w / 2, pb.y + pb.h / 2];
  const rb = box($("#rings").parentElement), rk = rb.w / rec.offsetWidth;
  $("#rings").style.left = (M.plusC[0] - rb.x) / rk + "px"; $("#rings").style.top = (M.plusC[1] - rb.y) / rk + "px";
}

const review = $("#review");
function renderReview(t) {
  const on = t >= T.revIn - 0.02 && t < T.revOut + 0.6; vis(review, on); if (!on) return;
  const L = LAY, ri = E.outX(P(t, T.revIn, T.revIn + 0.7)), ro = E.inC(P(t, T.saved - 0.3, T.saved + 0.15));
  review.style.transform = `translate3d(0,${f2((1 - ri) * 80)}px,${f2(-ro * 120)}px) rotateX(${f2(L.tilt.rx + (1 - ri) * 14)}deg) rotateY(${f2(L.tilt.ry)}deg) scale(${(1 - 0.03 * ro).toFixed(4)})`;
  op(review, Math.min(1, ri * 1.6) * (1 - ro)); bl(review, (1 - ri) * 10 + ro * 8);
  // Cards one after the other.
  [$("#rsum"), $("#cL"), $("#cA"), $(".rf")].forEach((el, i) => {
    const p = E.outX(P(t, T.revIn + 0.06 + i * 0.09, T.revIn + 0.7 + i * 0.09));
    el.style.transform = `translateY(${f2((1 - p) * 30)}px)`; op(el, Math.min(1, p * 1.6));
  });
  // Each row fills when its phrase lands.
  flights.forEach((f, i) => {
    const land = f.at + T.FLY, row = f.target;
    const p = P(t, land - 0.08, land + 0.3), e = E.outX(p);
    const v = $(".rv", row), rl = $(".rl", row), sk = $(".sk", row), fl = $(".fl", row);
    if (v) { v.style.transform = `translateX(${f2((1 - e) * -10)}px)`; op(v, p > 0 ? E.outC(p) : 0); bl(v, (1 - e) * 4); }
    if (sk) op(sk, 1 - p);
    if (rl && f.p.to === "rStage") { const tg = $(".tag", rl); op(tg, 0.35 + 0.65 * E.outC(p)); tg.style.transform = `scale(${lerp(0.85, 1, E.outB(p, 2)).toFixed(4)})`; }
    if (rl) rl.style.color = `color-mix(in oklch, var(--fg) ${Math.round(55 + 45 * E.outC(p))}%, transparent)`;
    if (fl) { fl.style.background = HL[f.p.tone]; op(fl, 0.9 * bump(P(t, land - 0.05, land + 0.75))); }
    const cb = $(".cb", row);
    if (cb) {
      const c = P(t, land, land + 0.24);
      $(".f", cb).style.transform = `scale(${E.outB(c, 1.8).toFixed(4)})`;
      op($("svg", cb), E.outC(P(t, land + 0.05, land + 0.25)));
    }
    if (f.p.to === "aHead") {
      // The name takes the place of the placeholders when her phrase lands.
      $$(".inp span", row).forEach(s => { op(s, E.outC(p)); s.style.transform = `translateX(${f2((1 - e) * -8)}px)`; });
      $$(".inp small", row).forEach(s => op(s, 1 - E.outC(P(t, land - 0.12, land + 0.1))));
    }
  });
  // The name lights up when the first phrase lands on Lars's card.
  const lp = bump(P(t, T.F[0] + T.FLY - 0.05, T.F[0] + T.FLY + 0.8));
  $("#lName").style.color = `color-mix(in oklch, var(--teal-ink) ${Math.round(lp * 100)}%, var(--fg))`;
  // Save: pressed, then "Saving…".
  const sv = E.ioC(P(t, T.tap + 0.04, T.tap + 0.2));
  op($("#sv1"), 1 - sv); op($("#sv2"), sv);
  $("#sv2 svg").style.transform = `rotate(${((t - T.tap) * 520) % 360}deg)`;
  let s = 1; s -= 0.05 * bump(P(t, T.tap - 0.06, T.tap + 0.18));
  $("#bSave").style.transform = `scale(${s.toFixed(4)})`;
}

function renderFlights(t) {
  for (const f of flights) {
    const p = P(t, f.at, f.at + T.FLY);
    if (p <= 0 || p >= 1) { op(f.el, 0); continue; }
    const src = f.p.words[0].el, sb = box(src), tb = box($(".rv", f.target) || $(".rl", f.target) || f.target);
    const tgt = f.p.to === "aHead" ? box(f.target) : tb;
    const fs = parseFloat(getComputedStyle(f.el).fontSize);
    const k0 = M.qk || 1, k1 = clamp(25 / fs * 1.05, 0.3, 1);
    const e = E.ioC(p), k = lerp(k0, k1, e);
    const x0 = sb.x - 0.16 * fs, y0 = sb.y + sb.h / 2;
    const x1 = tgt.x, y1 = tgt.y + tgt.h / 2;
    // An arc: up and over in 16:9, a swoop down in 4:5.
    const cx = lerp(x0, x1, 0.5) + (VERT ? 120 : 0), cy = Math.min(y0, y1) - (VERT ? 40 : 70);
    const x = (1 - e) ** 2 * x0 + 2 * (1 - e) * e * cx + e * e * x1, y = (1 - e) ** 2 * y0 + 2 * (1 - e) * e * cy + e * e * y1;
    f.el.style.transform = `translate(${f2(x)}px,${f2(y)}px) translateY(-50%) scale(${k.toFixed(4)})`;
    op(f.el, Math.min(1, p * 8) * (1 - P(p, 0.78, 1)));
    bl(f.el, 2.2 * bump(p));
  }
}

const saved = $("#saved");
function renderSaved(t) {
  const on = t >= T.saved - 0.1 && t < T.revOut + 0.6; vis(saved, on); if (!on) return;
  const L = LAY, si = E.outX(P(t, T.saved, T.saved + 0.6)), so = E.inC(P(t, T.revOut, T.revOut + 0.45));
  saved.style.transform = `translate3d(0,${f2((1 - si) * 40 - so * 30)}px,${f2(-so * 160)}px) rotateX(${f2(L.tilt.rx)}deg) rotateY(${f2(L.tilt.ry)}deg)`;
  op(saved, Math.min(1, si * 1.6) * (1 - so)); bl(saved, (1 - si) * 6 + so * 10);
  [$(".svt", saved), $("#svL"), $("#svA")].forEach((el, i) => {
    const p = E.outX(P(t, T.saved + i * 0.1, T.saved + 0.6 + i * 0.1));
    el.style.transform = `translateY(${f2((1 - p) * 24)}px)`; op(el, Math.min(1, p * 1.8));
  });
  const ti = $(".svt i", saved), q = P(t, T.saved + 0.05, T.saved + 0.4);
  ti.style.transform = `scale(${lerp(0.3, 1, E.outB(q, 2.2)).toFixed(4)})`;
}

function renderBoard(t) {
  const on = t >= T.boardIn - 0.02 && t < T.end + 0.1; vis(board, on); if (!on) return;
  const L = LAY, bi = E.outX(P(t, T.boardIn, T.boardIn + 0.75));
  board.style.transform = `translate3d(0,${f2((1 - bi) * 70)}px,0) rotateX(${f2(L.tilt.rx + (1 - bi) * 12)}deg) rotateY(${f2(L.tilt.ry)}deg)`;
  op(board, Math.min(1, bi * 1.5)); bl(board, (1 - bi) * 10);
  // Counts.
  for (const h of $$(".colh", board)) {
    const [a, b, at] = COUNTS[h.dataset.s], q = E.outX(P(t, at - 0.05, at + 0.35)), o = $(".o", h), n = $(".n", h);
    if (o.textContent !== String(a)) o.textContent = a; if (n.textContent !== String(b)) n.textContent = b;
    o.style.transform = `translateY(${(-q * 110).toFixed(1)}%)`; op(o, 1 - q);
    n.style.transform = `translateY(${((1 - q) * 110).toFixed(1)}%)`; op(n, q);
  }
  // Where each card sits: column, slot.
  const lm = E.ioC(P(t, T.lars - 0.15, T.lars + 0.45)), am = E.outX(P(t, T.anna - 0.1, T.anna + 0.55));
  const place = (c, col, slot, extra = "") => { c.el.style.transform = `translate(${f2(col)}px,${f2(slot)}px)${extra}`; };
  // Lars lifts out of Qualified and drops into Viewing, on top.
  const lift = bump(P(t, T.lars - 0.15, T.lars + 0.45));
  place(KC.lars, lerp(M.colX(1), M.colX(2), lm), M.slot(0) - 26 * lift, ` scale(${(1 + 0.05 * lift).toFixed(4)})`);
  KC.lars.el.style.zIndex = 5;
  KC.lars.el.style.boxShadow = `0 ${f2(30 + 40 * lift)}px ${f2(60 + 50 * lift)}px -30px rgba(0,0,0,.95), inset 0 1px 0 oklch(1 0 0 / 5%)`;
  place(KC.james, M.colX(1), lerp(M.slot(1), M.slot(0), E.ioC(P(t, T.lars + 0.05, T.lars + 0.6))));
  place(KC.anya, M.colX(2), lerp(M.slot(0), M.slot(1), E.ioC(P(t, T.lars - 0.1, T.lars + 0.45))));
  place(KC.sofia, M.colX(0), lerp(M.slot(0), M.slot(1), E.ioC(P(t, T.anna - 0.25, T.anna + 0.3))));
  place(KC.anna, M.colX(0), M.slot(0) + (1 - am) * -40, ` scale(${lerp(0.9, 1, E.outB(am, 1.4)).toFixed(4)})`);
  op(KC.anna.el, P(t, T.anna - 0.1, T.anna + 0.15)); bl(KC.anna.el, (1 - am) * 8);
  // Lars's budget rolls to the new figure and his first viewing shows.
  const fq = E.outX(P(t, T.lars + 0.25, T.lars + 0.65)), [f0, f1] = KC.lars.figs;
  f0.style.transform = `translateY(${f2(-fq * 26)}px)`; op(f0, 1 - fq);
  f1.style.transform = `translateY(${f2((1 - fq) * 26)}px)`; op(f1, fq);
  const nv = P(t, T.lars + 0.4, T.lars + 0.75);
  larsNew.style.transform = `scale(${lerp(0.4, 1, E.outB(nv, 1.8)).toFixed(4)})`; op(larsNew, E.outC(nv));
  larsNew.style.display = nv > 0 ? "" : "none";
  const ringL = $(".ring", KC.lars.el), rq = P(t, T.lars + 0.2, T.lars + 1.4);
  op(ringL, 0.9 * bump(rq)); ringL.style.boxShadow = "0 0 0 2px var(--teal)";
  const ringA = $(".ring", KC.anna.el), aq = P(t, T.anna + 0.1, T.anna + 1.3);
  op(ringA, 0.9 * bump(aq)); ringA.style.boxShadow = "0 0 0 2px var(--indigo)";
  // Each column brightens as something lands in it.
  $$(".colbg", board).forEach(bg => {
    const s = bg.dataset.s, pulse = s === "viewing" ? bump(P(t, T.lars, T.lars + 1.2)) : s === "new" ? bump(P(t, T.anna, T.anna + 1.2)) : 0;
    bg.style.background = `oklch(1 0 0 / ${(0.022 + 0.035 * pulse).toFixed(3)})`;
  });
}

const cal = $("#cal");
function renderCal(t) {
  const on = t >= T.boardIn + 0.1 && t < T.end + 0.1; vis(cal, on); if (!on) return;
  const L = LAY, ci = E.outX(P(t, T.boardIn + 0.12, T.boardIn + 0.9));
  cal.style.transform = `translate3d(0,${f2((1 - ci) * 70)}px,0) rotateX(${f2(L.tilt.rx + (1 - ci) * 12)}deg) rotateY(${f2(L.tilt.ry)}deg)`;
  op(cal, Math.min(1, ci * 1.5)); bl(cal, (1 - ci) * 10);
  const ev = $("#evNew"), d = P(t, T.cal - 0.05, T.cal + 0.35), sp = spring(Math.max(0, t - (T.cal - 0.05)), 2.3, 0.52);
  ev.style.transform = `translateY(${f2((1 - sp) * -110)}px) scale(${lerp(1.08, 1, E.outC(d)).toFixed(4)})`;
  op(ev, E.outC(P(t, T.cal - 0.05, T.cal + 0.12)));
  ev.style.boxShadow = `0 ${f2((1 - E.outC(d)) * 26)}px ${f2((1 - E.outC(d)) * 40 + 2)}px -10px rgba(0,0,0,.65), 0 0 0 ${f2(2 * bump(P(t, T.cal + 0.15, T.cal + 1.3)))}px oklch(0.96 0.006 84 / .5)`;
}

const touch = $("#touch");
function renderTouch(t) {
  // Holding the + …
  if (t < T.rel + 0.5 && M.plusC) {
    const a = P(t, T.press - 0.25, T.press), held = t < T.rel, r = P(t, T.rel, T.rel + 0.35);
    const s = held ? lerp(1.4, 1, E.outC(a)) * (1 + 0.04 * Math.sin(t * 5)) : lerp(1, 1.5, E.outC(r));
    touch.style.transform = `translate(${f2(M.plusC[0])}px,${f2(M.plusC[1])}px) scale(${s.toFixed(4)})`;
    op(touch, held ? E.outC(a) : 1 - r);
    return;
  }
  // … and tapping Save.
  if (t > T.curOn && t < T.tap + 0.6) {
    const sb = box($("#bSave")), x = sb.x + sb.w * 0.55, y = sb.y + sb.h * 0.55;
    const a = P(t, T.curOn, T.tap - 0.05), pr = bump(P(t, T.tap - 0.08, T.tap + 0.16)), o = P(t, T.tap + 0.15, T.tap + 0.45);
    const s = lerp(1.6, 1, E.outC(a)) * (1 - 0.15 * pr) + 0.5 * E.outC(o);
    touch.style.transform = `translate(${f2(x)}px,${f2(y + (1 - E.outC(a)) * 30)}px) scale(${s.toFixed(4)})`;
    op(touch, E.outC(a) * (1 - o));
    return;
  }
  op(touch, 0);
}

function renderEnd(t) {
  op($("#white"), E.inC(P(t, T.out + 0.05, T.end)) * (1 - P(t, T.end + 0.05, T.end + 0.2)));
  const on = t >= T.end; vis($("#end"), on); if (!on) return;
  $("#endIn").style.transform = `scale(${(lerp(1.03, 1, E.outX(P(t, T.end, T.end + 1.2))) * lerp(1, 1.015, E.ioS(P(t, T.end + 1.2, DUR)))).toFixed(5)})`;
  const item = (el, a, dy, base = "") => {
    const q = P(t, a, a + 0.8), e = E.outX(q);
    el.style.transform = `${base} translateY(${f2((1 - e) * dy)}px)`; op(el, Math.min(1, q * 2)); bl(el, (1 - e) * 10);
  };
  item($("#logo"), T.end + 0.05, 40, "translateX(-50%)");
  item($("#endLine"), T.end + 0.45, 30);
  item($("#tagl"), T.end + 0.95, 24);
  const c = P(t, T.end + 1.4, T.end + 2.1), cta = $("#cta");
  cta.style.transform = `translateX(-50%) scale(${lerp(0.82, 1, E.outB(c, 1.5)).toFixed(4)})`; op(cta, Math.min(1, c * 3));
}

function render(t) {
  t = clamp(t, 0, DUR);
  renderBg(t);
  renderCam(t);
  renderMark(t);
  renderHeads(t);
  renderQuote(t);
  renderRec(t);
  renderReview(t);
  renderFlights(t);
  renderSaved(t);
  renderBoard(t);
  renderCal(t);
  renderTouch(t);
  renderEnd(t);
  if (dbg) dbg.textContent = t.toFixed(2);
}

/* ---------- boot: fonts first, then live playback or the recorder's clock ---------- */
const params = new URLSearchParams(location.search);
const recording = params.has("record");
if (recording) document.body.classList.add("rec");
const dbg = params.has("debug") ? document.body.appendChild(Object.assign(document.createElement("div"), { style: "position:fixed;left:10px;top:10px;z-index:999;padding:6px 14px;border-radius:8px;background:rgba(0,0,0,.78);color:#fff;font:600 46px/1 ui-monospace,monospace" })) : null;
function fit() {
  const k = recording ? 1 : Math.min(innerWidth / CW, innerHeight / CH);
  $("#stage").style.transform = `translate(${(innerWidth - CW * k) / 2}px,${(innerHeight - CH * k) / 2}px) scale(${k})`;
}
fit(); addEventListener("resize", fit);
const faces = ['400 100px Sora', '500 100px Sora', '400 20px Geist', '500 20px Geist', '600 20px Geist', '400 20px "Geist Mono"'];
window.__film = {
  duration: DUR,
  ready: Promise.all(faces.map(f => document.fonts.load(f, ES ? "áéíóúñ€" : "€"))).then(() => document.fonts.ready).then(() => { layout(); render(0); return true; }),
  seek: t => render(t),
};
if (!recording) {
  let playing = !params.has("t"), t = parseFloat(params.get("t") || "0"), last = null;
  const pp = $("#pp"), scrub = $("#scrub"), ctime = $("#ctime");
  const showT = () => { scrub.value = t; ctime.textContent = t.toFixed(3); pp.textContent = playing ? "❚❚" : "▶"; };
  window.__film.ready.then(() => {
    render(t); showT();
    const tick = now => { if (playing) { if (last !== null) t = (t + (now - last) / 1000) % DUR; render(t); showT(); } last = now; requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
  pp.onclick = () => { playing = !playing; last = null; showT(); };
  scrub.oninput = () => { t = parseFloat(scrub.value); playing = false; render(t); showT(); };
  addEventListener("keydown", e => {
    if (e.code === "Space") { playing = !playing; last = null; }
    if (e.code === "ArrowRight") { playing = false; t = Math.min(DUR, t + (e.shiftKey ? 1 : 1 / 60)); render(t); }
    if (e.code === "ArrowLeft") { playing = false; t = Math.max(0, t - (e.shiftKey ? 1 : 1 / 60)); render(t); }
    showT();
  });
  let idle; addEventListener("mousemove", () => { document.body.classList.remove("idle"); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add("idle"), 1800); });
}
</script>
